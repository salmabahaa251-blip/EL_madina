<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جدول تاسكات الأدوار</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar: اللوجو على الشمال -->
  <nav class="navbar navbar-dark app-nav" dir="ltr">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <span class="logo-mark" title="سكن طلاب">
          <i class="fa-solid fa-building"></i>
          <i class="fa-solid fa-graduation-cap logo-cap"></i>
        </span>
        <span class="logo-text">Madenite El-talibat</span>
      </a>
      <button id="resetBtn" class="btn btn-outline-light btn-sm">
        <i class="fa-solid fa-rotate-left"></i> إعادة ضبط
      </button>
    </div>
  </nav>

  <main class="container py-4">
    <header class="hero mb-4">
      <h1 class="h3 mb-2">جدول تاسكات الأدوار</h1>
      <p class="text-muted mb-0">كل دور في كارد، وجواه كروت الأجنحة، وجوه كل جناح الأوض. الأوض الأقل تنفيذاً للتاسك، والأولى هي اللي عليها الدور.</p>
    </header>

    <!-- كروت الأدوار (بتتبني من script.js) -->
    <div id="floors" class="d-flex flex-column gap-4"></div>
  </main>

  <!-- Modal التفاصيل -->
  <div class="modal fade" id="roomModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fa-solid fa-door-closed"></i> أوضة <span id="mRoom"></span></h5>
          <button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between"><span>الدور</span><strong id="mFloor"></strong></li>
            <li class="list-group-item d-flex justify-content-between"><span>الجناح</span><strong id="mWing"></strong></li>
            <li class="list-group-item d-flex justify-content-between"><span>رقم الأوضة</span><strong id="mNumber"></strong></li>
            <li class="list-group-item d-flex justify-content-between"><span>عدد مرات التنفيذ</span><strong id="mCount"></strong></li>
            <li class="list-group-item d-flex justify-content-between"><span>عدد مرات التخطي</span><strong id="mSkips"></strong></li>
            <li class="list-group-item d-flex justify-content-between"><span>آخر تسليم</span><strong id="mLastDone"></strong></li>
            <li class="list-group-item d-flex justify-content-between"><span>الحالة</span><strong id="mStatus"></strong></li>
          </ul>
          <h6 class="mt-3 mb-2"><i class="fa-solid fa-clock-rotate-left"></i> سجل التسليم</h6>
          <ul class="list-group history-list" id="mHistory"></ul>
        </div>
        <div class="modal-footer">
          <button id="mDoneBtn" class="btn btn-success w-100">
            <i class="fa-solid fa-check"></i> تم تنفيذ التاسك
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
